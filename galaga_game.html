<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Galaga</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; margin: 0 auto; background: #000; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// GALAGA - Classic Arcade Reproduction
// Single-file, zero dependencies
// ============================================================

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

// --- Constants ---
var W = 480;
var H = 640;
var FPS = 60;
var PLAYER_SPEED = 4;
var BULLET_SPEED = 7;
var ENEMY_BULLET_SPEED = 4;
var MAX_ENEMIES = 18;
var STAGE_CLEAR_BONUS = 100;

// --- Game state ---
var state = "title"; // title, playing, gameover, stageintro
var score = 0;
var highScore = 0;
var lives = 3;
var stage = 1;
var stageTimer = 0;
var shakeTimer = 0;
var shakeMag = 0;

// --- Player ---
var player = { x: W / 2, y: H - 50, w: 28, h: 28, alive: true, respawnTimer: 0, invincible: 0 };

// --- Bullets ---
var playerBullets = [];
var enemyBullets = [];

// --- Enemies ---
var enemies = [];
var enemyFormations = [];
var formationX = 0;
var formationY = 0;
var formationDir = 1;

// --- Particles ---
var particles = [];

// --- Stars ---
var stars = [];
for (var i = 0; i < 60; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5, sp: Math.random() * 0.5 + 0.2 });
}

// --- Input ---
var keys = {};
document.addEventListener("keydown", function (e) {
    keys[e.key] = true;
    if (e.key === " " || e.key === "Enter") {
        if (state === "title") startGame();
        else if (state === "gameover") { state = "title"; }
        // Space is consumed for state transitions; clear it so it doesn't
        // also fire a shot on the very next playing frame.
        keys[" "] = false;
        keys["Space"] = false;
    }
    e.preventDefault();
});
document.addEventListener("keyup", function (e) { keys[e.key] = false; });

// Touch controls
var touchX = null;
canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    touchX = (e.touches[0].clientX - rect.left) / rect.width * W;
    if (state === "title") startGame();
    else if (state === "gameover") { state = "title"; }
});
canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    touchX = (e.touches[0].clientX - rect.left) / rect.width * W;
});
canvas.addEventListener("touchend", function (e) { e.preventDefault(); touchX = null; });

// --- Audio (Web Audio API, no files) ---
var audioCtx = null;
function getAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    return audioCtx;
}

function playShot() {
    var a = getAudio(); if (!a) return;
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(880, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(220, a.currentTime + 0.1);
    g.gain.setValueAtTime(0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.1);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime); o.stop(a.currentTime + 0.1);
}

function playExplosion() {
    var a = getAudio(); if (!a) return;
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(200, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(50, a.currentTime + 0.3);
    g.gain.setValueAtTime(0.2, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.3);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime); o.stop(a.currentTime + 0.3);
}

function playTractor() {
    var a = getAudio(); if (!a) return;
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(440, a.currentTime);
    o.frequency.setValueAtTime(660, a.currentTime + 0.1);
    o.frequency.setValueAtTime(440, a.currentTime + 0.2);
    o.frequency.setValueAtTime(660, a.currentTime + 0.3);
    g.gain.setValueAtTime(0.1, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.4);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime); o.stop(a.currentTime + 0.4);
}

function playStageClear() {
    var a = getAudio(); if (!a) return;
    var notes = [523, 659, 784, 1047];
    for (var i = 0; i < notes.length; i++) {
        var o = a.createOscillator();
        var g = a.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(notes[i], a.currentTime + i * 0.12);
        g.gain.setValueAtTime(0.12, a.currentTime + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + i * 0.12 + 0.12);
        o.connect(g); g.connect(a.destination);
        o.start(a.currentTime + i * 0.12); o.stop(a.currentTime + i * 0.12 + 0.12);
    }
}

// --- Enemy types ---
// 0 = butterfly, 1 = bee, 2 = boss
var enemyColors = [
    { body: "#ff4444", wing: "#ffaa00", accent: "#ffffff" },  // butterfly
    { body: "#44aaff", wing: "#0066ff", accent: "#ffffff" },  // bee
    { body: "#ff00ff", wing: "#ff6600", accent: "#ffff00" }   // boss
];

function createEnemy(x, y, type) {
    return {
        x: x, y: y, type: type,
        w: type === 2 ? 36 : 24, h: type === 2 ? 32 : 24,
        alive: true, entering: true, enterProgress: 0,
        enterFromX: x, enterFromY: -40,
        fireTimer: Math.random() * 200 + 100,
        wobble: Math.random() * Math.PI * 2
    };
}

function setupFormation() {
    enemies = [];
    // Row 1: 3 bosses (top)
    for (var i = 0; i < 3; i++) {
        enemies.push(createEnemy(0, 0, 2));
    }
    // Row 2: 4 bees
    for (var i = 0; i < 4; i++) {
        enemies.push(createEnemy(0, 0, 1));
    }
    // Rows 3-5: 3 butterflies each
    for (var r = 0; r < 3; r++) {
        for (var i = 0; i < 3; i++) {
            enemies.push(createEnemy(0, 0, 0));
        }
    }
    // Assign formation positions
    var row = 0, col = 0, count = 0;
    var spacingX = 50, spacingY = 36;
    var startX = W / 2 - (spacingX * 2);
    var startY = 80;

    // Bosses: row 0, 3 enemies
    for (var i = 0; i < 3; i++) {
        enemies[count].fx = startX + i * spacingX;
        enemies[count].fy = startY;
        enemies[count].enterDelay = count * 8;
        count++;
    }
    // Bees: row 1, 4 enemies
    for (var i = 0; i < 4; i++) {
        enemies[count].fx = startX - spacingX / 2 + i * spacingX;
        enemies[count].fy = startY + spacingY;
        enemies[count].enterDelay = count * 8;
        count++;
    }
    // Butterflies: rows 2-4, 3 each
    for (var r = 0; r < 3; r++) {
        for (var i = 0; i < 3; i++) {
            enemies[count].fx = startX + i * spacingX;
            enemies[count].fy = startY + spacingY * (r + 2);
            enemies[count].enterDelay = count * 8;
            count++;
        }
    }

    // Set initial off-screen positions
    for (var i = 0; i < enemies.length; i++) {
        enemies[i].x = W / 2;
        enemies[i].y = -40 - i * 10;
        enemies[i].entering = true;
        enemies[i].enterProgress = 0;
    }
}

function startGame() {
    score = 0;
    lives = 3;
    stage = 1;
    player.alive = true;
    player.invincible = 0;
    playerBullets = [];
    enemyBullets = [];
    particles = [];
    state = "stageintro";
    stageTimer = 120;
    setupFormation();
}

function nextStage() {
    stage++;
    playerBullets = [];
    enemyBullets = [];
    state = "stageintro";
    stageTimer = 120;
    setupFormation();
}

// --- Spawn particles ---
function spawnExplosion(x, y, color, count) {
    for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = Math.random() * 3 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

// --- Collision ---
function rectCollide(a, b) {
    return a.x - a.w / 2 < b.x + b.w / 2 &&
           a.x + a.w / 2 > b.x - b.w / 2 &&
           a.y - a.h / 2 < b.y + b.h / 2 &&
           a.y + a.h / 2 > b.y - b.h / 2;
}

function pointInRect(px, py, rx, ry, rw, rh) {
    return px > rx - rw / 2 && px < rx + rw / 2 && py > ry - rh / 2 && py < ry + rh / 2;
}

// --- Update ---
function update() {
    // Stars
    for (var i = 0; i < stars.length; i++) {
        stars[i].y += stars[i].sp;
        if (stars[i].y > H) { stars[i].y = 0; stars[i].x = Math.random() * W; }
    }

    // Particles
    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    if (state === "stageintro") {
        stageTimer--;
        if (stageTimer <= 0) state = "playing";
        // Animate enemies flying in
        for (var i = 0; i < enemies.length; i++) {
            var e = enemies[i];
            if (!e.alive) continue;
            if (e.entering) {
                e.enterDelay--;
                if (e.enterDelay <= 0) {
                    e.enterProgress += 0.03;
                    if (e.enterProgress >= 1) {
                        e.entering = false;
                        e.x = e.fx;
                        e.y = e.fy;
                    } else {
                        // Curve from top-center to formation position
                        var t = e.enterProgress;
                        var ct = 1 - t;
                        e.x = ct * ct * (W / 2) + 2 * ct * t * (W / 2 + (e.fx - W / 2) * 0.5) + t * t * e.fx;
                        e.y = ct * ct * (-40) + 2 * ct * t * (e.fy * 0.3) + t * t * e.fy;
                    }
                }
            }
        }
        return;
    }

    if (state !== "playing") return;

    // Player movement
    if (player.alive) {
        if (keys["ArrowLeft"] || keys["a"]) player.x -= PLAYER_SPEED;
        if (keys["ArrowRight"] || keys["d"]) player.x += PLAYER_SPEED;
        if (touchX !== null) {
            var diff = touchX - player.x;
            if (Math.abs(diff) > 4) player.x += Math.sign(diff) * Math.min(PLAYER_SPEED, Math.abs(diff));
        }
        player.x = Math.max(20, Math.min(W - 20, player.x));
        if (player.invincible > 0) player.invincible--;

        // Shooting
        if ((keys[" "] || keys["Space"]) && playerBullets.length < 2) {
            playerBullets.push({ x: player.x, y: player.y - 16, w: 3, h: 10 });
            playShot();
            keys[" "] = false;
            keys["Space"] = false;
        }
    } else {
        player.respawnTimer--;
        if (player.respawnTimer <= 0) {
            if (lives > 0) {
                player.x = W / 2;
                player.alive = true;
                player.invincible = 120;
            } else {
                state = "gameover";
                if (score > highScore) highScore = score;
            }
        }
    }

    // Player bullets
    for (var i = playerBullets.length - 1; i >= 0; i--) {
        playerBullets[i].y -= BULLET_SPEED;
        if (playerBullets[i].y < -10) { playerBullets.splice(i, 1); continue; }

        // Check hit enemies - test the bullet's center AND its nose (top tip),
        // because at 7px/frame a 3px-tall bullet can step straight past the
        // top edge of a slow, swaying enemy between frames.
        var bx = playerBullets[i].x, by = playerBullets[i].y;
        var hit = false;
        for (var j = 0; j < enemies.length; j++) {
            var e = enemies[j];
            if (!e.alive || e.entering) continue;
            var rw = e.w + 4, rh = e.h + 4;
            if (pointInRect(bx, by, e.x, e.y, rw, rh) ||
                pointInRect(bx, by - BULLET_SPEED, e.x, e.y, rw, rh)) {
                e.alive = false;
                hit = true;
                var pts = e.type === 2 ? 150 : (e.type === 1 ? 80 : 50);
                score += pts;
                var ec = enemyColors[e.type].body;
                spawnExplosion(e.x, e.y, ec, 12);
                playExplosion();
                shakeTimer = 6;
                shakeMag = 3;
                break;
            }
        }
        if (hit) playerBullets.splice(i, 1);
    }

    // Check all enemies dead
    var allDead = true;
    for (var i = 0; i < enemies.length; i++) {
        if (enemies[i].alive) { allDead = false; break; }
    }
    if (allDead) {
        score += STAGE_CLEAR_BONUS;
        playStageClear();
        nextStage();
        return;
    }

    // Formation sway
    var swayX = Math.sin(Date.now() * 0.001) * 30;
    var swayY = Math.sin(Date.now() * 0.0007) * 10;

    // Enemy movement and firing
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (!e.alive) continue;
        if (e.entering) continue;

        e.wobble += 0.05;
        e.x = e.fx + swayX + Math.sin(e.wobble) * 3;
        e.y = e.fy + swayY + Math.cos(e.wobble * 0.7) * 2;

        // Firing
        e.fireTimer--;
        if (e.fireTimer <= 0 && player.alive) {
            var bulletSpeed = ENEMY_BULLET_SPEED + stage * 0.3;
            // Aim at player with some inaccuracy
            var dx = player.x - e.x;
            var dy = player.y - e.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0) {
                var inaccuracy = (Math.random() - 0.5) * 0.3;
                var angle = Math.atan2(dy, dx) + inaccuracy;
                enemyBullets.push({
                    x: e.x, y: e.y + e.h / 2,
                    vx: Math.cos(angle) * bulletSpeed,
                    vy: Math.sin(angle) * bulletSpeed,
                    w: 4, h: 4
                });
            }
            e.fireTimer = Math.max(30, 150 - stage * 10) + Math.random() * 100;
        }
    }

    // Enemy bullets
    for (var i = enemyBullets.length - 1; i >= 0; i--) {
        var b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) {
            enemyBullets.splice(i, 1);
            continue;
        }
        // Hit player
        if (player.alive && player.invincible <= 0) {
            if (pointInRect(b.x, b.y, player.x, player.y, player.w, player.h)) {
                player.alive = false;
                lives--;
                player.respawnTimer = 90;
                spawnExplosion(player.x, player.y, "#44ff44", 20);
                playExplosion();
                shakeTimer = 10;
                shakeMag = 5;
                enemyBullets.splice(i, 1);
            }
        }
    }

    // Screen shake
    if (shakeTimer > 0) shakeTimer--;
}

// --- Draw ---
function drawShip(x, y, w, h, color, wingColor, accent, isPlayer) {
    ctx.save();
    ctx.translate(x, y);

    if (isPlayer) {
        // Player ship (green fighter)
        // Body
        ctx.fillStyle = "#44ff44";
        ctx.beginPath();
        ctx.moveTo(0, -h / 2);
        ctx.lineTo(-w / 4, h / 2);
        ctx.lineTo(w / 4, h / 2);
        ctx.closePath();
        ctx.fill();
        // Wings
        ctx.fillStyle = "#22cc22";
        ctx.beginPath();
        ctx.moveTo(-w / 4, h / 4);
        ctx.lineTo(-w / 2, h / 2 + 4);
        ctx.lineTo(-w / 4, h / 3);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(w / 4, h / 4);
        ctx.lineTo(w / 2, h / 2 + 4);
        ctx.lineTo(w / 4, h / 3);
        ctx.closePath();
        ctx.fill();
        // Cockpit
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, -h / 6, 3, 0, Math.PI * 2);
        ctx.fill();
        // Engine glow
        ctx.fillStyle = "#ffff00";
        ctx.fillRect(-2, h / 2, 4, 3 + Math.random() * 3);
    } else {
        // Enemy ship
        // Wings (flapping)
        var flap = Math.sin(Date.now() * 0.01 + (y || 0)) * 4;
        ctx.fillStyle = wingColor;
        // Left wing
        ctx.beginPath();
        ctx.moveTo(-w / 4, -h / 6);
        ctx.lineTo(-w / 2 - 2, -h / 4 + flap);
        ctx.lineTo(-w / 4, h / 6);
        ctx.closePath();
        ctx.fill();
        // Right wing
        ctx.beginPath();
        ctx.moveTo(w / 4, -h / 6);
        ctx.lineTo(w / 2 + 2, -h / 4 - flap);
        ctx.lineTo(w / 4, h / 6);
        ctx.closePath();
        ctx.fill();
        // Body
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, 0, w / 3, h / 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Eyes
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(-w / 8, -h / 8, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w / 8, -h / 8, 2, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function draw() {
    ctx.save();

    // Screen shake
    if (shakeTimer > 0) {
        ctx.translate(
            (Math.random() - 0.5) * shakeMag * 2,
            (Math.random() - 0.5) * shakeMag * 2
        );
    }

    // Clear
    ctx.fillStyle = "#000011";
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Stars
    ctx.fillStyle = "#ffffff";
    for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        ctx.globalAlpha = s.s / 2;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // Particles
    for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Player bullets
    ctx.fillStyle = "#ffff00";
    for (var i = 0; i < playerBullets.length; i++) {
        var b = playerBullets[i];
        ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }

    // Enemy bullets
    ctx.fillStyle = "#ff4444";
    for (var i = 0; i < enemyBullets.length; i++) {
        var b = enemyBullets[i];
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.w / 2, 0, Math.PI * 2);
        ctx.fill();
    }

    // Enemies
    for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (!e.alive) continue;
        var c = enemyColors[e.type];
        drawShip(e.x, e.y, e.w, e.h, c.body, c.wing, c.accent, false);
    }

    // Player
    if (player.alive) {
        if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) {
            // Blinking
        } else {
            drawShip(player.x, player.y, player.w, player.h, "#44ff44", "#22cc22", "#ffffff", true);
        }
    }

    // --- UI ---
    if (state === "title") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 48px monospace";
        ctx.textAlign = "center";
        ctx.fillText("GALAGA", W / 2, H / 3);

        ctx.font = "18px monospace";
        ctx.fillStyle = "#ffaa00";
        ctx.fillText("A Classic Arcade Reproduction", W / 2, H / 3 + 40);

        ctx.fillStyle = "#ffffff";
        ctx.font = "16px monospace";
        ctx.fillText("Press SPACE or TAP to Start", W / 2, H / 2 + 40);

        ctx.fillStyle = "#888888";
        ctx.font = "14px monospace";
        ctx.fillText("Arrows / A,D to move  |  SPACE to shoot", W / 2, H / 2 + 70);
        ctx.fillText("Touch: drag to move, auto-shoot", W / 2, H / 2 + 90);

        if (highScore > 0) {
            ctx.fillStyle = "#44ff44";
            ctx.font = "16px monospace";
            ctx.fillText("High Score: " + highScore, W / 2, H / 2 + 120);
        }
    }

    if (state === "stageintro") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 32px monospace";
        ctx.textAlign = "center";
        ctx.fillText("STAGE " + stage, W / 2, H / 2);
        ctx.font = "16px monospace";
        ctx.fillStyle = "#ffaa00";
        ctx.fillText("GET READY", W / 2, H / 2 + 30);
    }

    if (state === "gameover") {
        ctx.fillStyle = "#ff4444";
        ctx.font = "bold 40px monospace";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", W / 2, H / 3);

        ctx.fillStyle = "#ffffff";
        ctx.font = "20px monospace";
        ctx.fillText("Score: " + score, W / 2, H / 3 + 50);

        if (score >= highScore && score > 0) {
            ctx.fillStyle = "#ffff00";
            ctx.fillText("NEW HIGH SCORE!", W / 2, H / 3 + 80);
        }

        ctx.fillStyle = "#888888";
        ctx.font = "16px monospace";
        ctx.fillText("Press SPACE or TAP for Title", W / 2, H / 2 + 40);
    }

    // HUD
    if (state === "playing" || state === "stageintro") {
        ctx.textAlign = "left";
        ctx.fillStyle = "#ffffff";
        ctx.font = "16px monospace";
        ctx.fillText("SCORE " + score, 10, 24);
        ctx.fillText("HI " + Math.max(highScore, score), 10, 44);
        ctx.fillText("STAGE " + stage, W - 100, 24);

        // Lives
        for (var i = 0; i < lives; i++) {
            drawShip(W - 30 - i * 30, H - 16, 16, 16, "#44ff44", "#22cc22", "#ffffff", true);
        }
    }

    ctx.restore();
}

// --- Touch auto-shoot ---
var lastTouchShot = 0;
var origUpdate = update;
update = function () {
    origUpdate();
    // Auto-shoot on touch
    if (touchX !== null && state === "playing" && player.alive) {
        var now = Date.now();
        if (now - lastTouchShot > 300 && playerBullets.length < 2) {
            playerBullets.push({ x: player.x, y: player.y - 16, w: 3, h: 10 });
            playShot();
            lastTouchShot = now;
        }
    }
};

// --- Resize ---
function resize() {
    var scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = (W * scale) + "px";
    canvas.style.height = (H * scale) + "px";
}
window.addEventListener("resize", resize);
resize();

// --- Game loop ---
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
